[project]
name = "drepurpose"
version = "0.1.0"
description = ""
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "numpy>=2.5.2",
    "optimuskg>=1.0.0",
    "polars>=1.44.1",
    "torch==2.12.1",
    "torch-geometric==2.8.0",
]

[project.scripts]
drepurpose = "drepurpose.cli:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "huggingface-hub>=1.28.0",
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "ruff>=0.16.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = [
    "B",
    "E4",
    "E7",
    "E9",
    "F",
    "I",
    "RUF",
    "SIM",
    "UP",
]

[tool.ruff.format]
skip-magic-trailing-comma = false

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.14"
typeCheckingMode = "standard"

[tool.uv.sources]
torch = [
    { index = "pytorch-cu126", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
